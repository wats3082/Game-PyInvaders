<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyInvaders</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>PyInvaders</h1>
        <p>Galaga-inspired browser beta</p>
      </header>

      <section class="hud">
        <div class="chip">Score: <span id="score">0</span></div>
        <div class="chip">Best: <span id="best">0</span></div>
        <div class="chip">Lives: <span id="lives">3</span></div>
        <div class="chip">Wave: <span id="wave">1</span></div>
        <div class="chip">Status: <span id="status">Running</span></div>
      </section>

      <section class="controls">
        <button id="pause-btn" type="button">Pause</button>
        <button id="audio-btn" type="button">Music: Off</button>
      </section>

      <canvas id="game" width="1280" height="720" aria-label="PyInvaders game canvas"></canvas>

      <footer class="footer">
        Controls: Move with Arrow keys (or A/D), fire with Space, restart with R, pause with P.
      </footer>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
